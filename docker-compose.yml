services:
  web:
    build:
      context: .
    container_name: intera-users
    env_file:
      - .env
    command: >
      sh -c "
        uv run manage.py makemigrations &&
        uv run manage.py migrate &&
        uv run manage.py runserver 0.0.0.0:7001
      "
    volumes:
      - .:/app
      - venv:/app/.venv
    ports:
      - "7001:7001"
    restart: unless-stopped

volumes:
  venv: