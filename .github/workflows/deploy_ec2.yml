name: Deploy EC2

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-ec2-${{ github.repository }}-${{ inputs.target_environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /srv/interaims/repositories/${{ github.event.repository.name }}
  COMPOSE_FILE: docker-compose.server.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || (github.ref_name == 'main' && 'prod' || 'dev') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY || secrets.EC2_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "An EC2 SSH key is required"; exit 1; }
          test -n "${{ secrets.EC2_HOST }}" || { echo "EC2_HOST is required"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            : > ~/.ssh/known_hosts
            for attempt in $(seq 1 30); do
              if ssh-keyscan -T 5 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
                break
              fi
              sleep 5
            done
            test -s ~/.ssh/known_hosts || { echo "SSH host is not ready"; exit 1; }
          fi
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  IdentityFile ~/.ssh/deploy_key' '  IdentitiesOnly yes' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync repository
        run: |
          set -euo pipefail
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p '${{ env.DEPLOY_PATH }}'"
          rsync -az --delete -e "ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10" \
            --exclude='.git' --exclude='.github' --exclude='.venv' \
            --exclude='.env' --exclude='.env.*' --exclude='__pycache__' --exclude='*.pyc' \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Write environment file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "${ENV_FILE}" || { echo "ENV_FILE is required"; exit 1; }
          printf '%s' "${ENV_FILE}" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cat > '${{ env.DEPLOY_PATH }}/.env' && chmod 600 '${{ env.DEPLOY_PATH }}/.env'"

      - name: Deploy with migrations
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "DEPLOY_PATH='${{ env.DEPLOY_PATH }}' COMPOSE_FILE='${{ env.COMPOSE_FILE }}' REPOSITORY_NAME='${REPOSITORY_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail
          flock /tmp/interaims-ec2-deploy.lock bash <<'LOCKED'
          set -euo pipefail
          /usr/local/bin/interaims-host-init
          cd "${DEPLOY_PATH}"
          docker compose -f "${COMPOSE_FILE}" --profile release build
          case "${REPOSITORY_NAME}" in
            kafka_a2a)
              ;;
            subscriptions)
              docker compose -f "${COMPOSE_FILE}" --profile release run --rm -T migrate </dev/null
              docker compose -f "${COMPOSE_FILE}" --profile release run --rm -T release-tasks </dev/null
              ;;
            *)
              docker compose -f "${COMPOSE_FILE}" --profile release run --rm -T migrate </dev/null
              ;;
          esac
          # Explicitly remove named containers before recreation; this avoids stale
          # container_name instances surviving a Compose up on the host.
          old_containers="$(docker compose -f "${COMPOSE_FILE}" ps -aq || true)"
          if [ -n "${old_containers}" ]; then
            docker rm -f ${old_containers}
          fi
          docker compose -f "${COMPOSE_FILE}" down --remove-orphans || true
          docker compose -f "${COMPOSE_FILE}" up -d --build --force-recreate --remove-orphans
          docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || docker restart caddy
          docker image prune -f || true
          docker compose -f "${COMPOSE_FILE}" ps
          LOCKED
          REMOTE

      - name: Verify deployment
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "DEPLOY_PATH='${{ env.DEPLOY_PATH }}' COMPOSE_FILE='${{ env.COMPOSE_FILE }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          services="$(docker compose -f "${COMPOSE_FILE}" config --services | grep -v '^migrate$')"
          while IFS= read -r service; do
            [ -n "${service}" ] || continue
            container_id="$(docker compose -f "${COMPOSE_FILE}" ps -q "${service}")"
            test -n "${container_id}" || { echo "Missing container for ${service}"; docker compose -f "${COMPOSE_FILE}" ps -a; exit 1; }
            state="$(docker inspect -f '{{.State.Status}}' "${container_id}")"
            test "${state}" = running || { echo "Service ${service} is ${state}"; docker compose -f "${COMPOSE_FILE}" ps -a; exit 1; }
            image_ref="$(docker inspect -f '{{.Config.Image}}' "${container_id}")"
            running_image="$(docker inspect -f '{{.Image}}' "${container_id}")"
            expected_image="$(docker image inspect "${image_ref}" -f '{{.Id}}')"
            test "${running_image}" = "${expected_image}" || { echo "Service ${service} is using a stale image"; exit 1; }
          done <<< "${services}"
          docker compose -f "${COMPOSE_FILE}" ps
          REMOTE


