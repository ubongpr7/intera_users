name: Deploy EC2

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-ec2-${{ github.repository }}-${{ inputs.target_environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /srv/interaims/repos/${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p '${{ env.DEPLOY_PATH }}'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Write environment file
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'EOF'
          set -euo pipefail
          cd "${{ env.DEPLOY_PATH }}"
          cat > .env <<'__ENV_FILE__'
          ${{ secrets.ENV_FILE }}
          __ENV_FILE__
          chmod 600 .env
          EOF

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'EOF'
          set -euo pipefail
          cd "${{ env.DEPLOY_PATH }}"
          docker compose down --remove-orphans --volumes
          docker compose up -d --build --force-recreate --remove-orphans
          docker image prune -f
          docker compose ps
          EOF
